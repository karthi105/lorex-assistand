<!DOCTYPE html>
<html lang="en">

<head>

    <title>Karthick's Lorex Assistant for Agents</title>

    <meta name="description"
        content="Karthick's Lorex Assistant for Agents - Technical troubleshooting guide for security cameras and recorders.">

<body>

    <header>
        <h1>Lorex Assistant for Agents</h1>
